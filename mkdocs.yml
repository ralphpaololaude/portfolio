site_name: Ralph Laude | Portfolio
site_url: https://ralphpaololaude.github.io/portfolio

# Theme
theme:
  name: material
  icon:
    logo: material/code-braces
  favicon: favicon.ico
  font:
    text: Noto Sans
  palette:
  # Palette toggle for light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
    primary: custom
    accent:  blue
  # Palette toggle for dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
    primary: custom
    accent:  blue
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.sections
    - navigation.indexes

# Extras
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/extra.js

# Markdown Extensions
markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji 
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Plugins
#plugins:
#  - blog

# Footer
copyright: Copyright &copy; 2026 Ralph Laude
extra:
  social:
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/rappaolau
      name: ralphpaololaude on LinkedIn
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/ralphpaololaude/
      name: ralphpaololaude on LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/ralphpaololaude
      name: ralphpaololaude on GitHub

# Page tree
nav:
  - Home: index.md
  - Technical writing: 
    - api-doc/index.md
    - API documentation: api-doc/api-doc.md
  - Workflows:
    - workflows/index.md
  - Blog:
    - blog/index.md